<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property SKN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#1d2a2b; --muted:#667476; --line:#e2ded5;
  --brand:#0f3d3e; --brand2:#14595b; --accent:#e0a526;
  --sewa:#1f8a4c; --sewa-bg:#e3f4ea; --tempo:#c77700; --tempo-bg:#fdf0d9;
  --lewat:#c62f2f; --lewat-bg:#fbe3e1; --kosong:#2f5d9e; --kosong-bg:#e3ecf8;
  --pakai:#6b4fa0; --pakai-bg:#eee8f7; --jual:#7a7a7a; --jual-bg:#ececec;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;letter-spacing:.3px;font-size:18px;flex:1;min-width:0}
.logo small{display:block;font-weight:500;font-size:12px;opacity:.75;letter-spacing:0}
.chip-nama{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;max-width:45vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-ikon{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:16px;flex:none}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
@media(max-width:420px){nav{gap:0;justify-content:space-between}nav button{padding:10px 2px!important;font-size:12.5px!important}}
nav button{background:none;border:0;color:rgba(255,255,255,.7);padding:10px 7px;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:16px}
main.lebar{max-width:none}
main.sedang{max-width:1200px}
.view{display:none}.view.on{display:block}
h2{font-size:17px;margin:20px 0 10px}
h2:first-child{margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line);cursor:pointer;text-align:left}
.tile b{display:block;font-size:26px;line-height:1.1;font-weight:800}
.tile span{font-size:13px;color:var(--muted)}
.tile.sewa b{color:var(--sewa)}.tile.tempo b{color:var(--tempo)}.tile.lewat b{color:var(--lewat)}.tile.kosong b{color:var(--kosong)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;background:#faf9f6}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.alat{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.alat input[type=search]{flex:1 1 220px}
input,select,textarea{background:#fff;border:1px solid #cfcac0;border-radius:10px;padding:9px 11px;min-width:0;width:100%}
.alat select{width:auto;flex:1 1 130px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand2);outline-offset:0;border-color:var(--brand2)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.merah{background:var(--lewat)}
.btn.kecil{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.info{font-size:13px;color:var(--muted);margin:0 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;text-align:left;width:100%;display:block}
.item:hover{border-color:#bdb7aa}
.item .t{display:flex;gap:8px;align-items:flex-start}
.item .t b{flex:1;min-width:0;font-weight:700}
.item .s{font-size:13px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.b-sewa{background:var(--sewa-bg);color:var(--sewa)}.b-tempo{background:var(--tempo-bg);color:var(--tempo)}
.b-lewat{background:var(--lewat-bg);color:var(--lewat)}.b-kosong{background:var(--kosong-bg);color:var(--kosong)}
.b-pakai{background:var(--pakai-bg);color:var(--pakai)}.b-jual{background:var(--jual-bg);color:var(--jual)}
.b-selesai{background:var(--jual-bg);color:var(--jual)}
.kosong-teks{padding:20px;text-align:center;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,25,25,.45);display:none;z-index:50;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 24px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet-head h3{flex:1;margin:0;font-size:17px}
.tutup{background:#fff;border:1px solid var(--line);border-radius:999px;width:34px;height:34px;cursor:pointer;flex:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:#3d4a4b}
.form label.full{grid-column:1/-1}
.form label em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
@media(max-width:520px){.form{grid-template-columns:1fr}}
.aksi{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.dl dt{color:var(--muted)}.dl dd{margin:0;word-break:break-word}
@media(max-width:520px){.dl{grid-template-columns:110px 1fr}}
.cek-list{max-height:220px;overflow:auto;background:#fff;border:1px solid #cfcac0;border-radius:10px;padding:4px 8px}
.cek-list label{flex-direction:row;align-items:flex-start;gap:8px;font-weight:400;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.cek-list label:last-child{border-bottom:0}
.cek-list input{width:auto;margin-top:3px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2a2b;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;display:none;max-width:90vw;font-size:14px}
.toast.err{background:var(--lewat)}
.memuat{position:fixed;inset:0;background:rgba(243,241,236,.7);display:none;align-items:center;justify-content:center;z-index:80;font-weight:700}
.memuat.on{display:flex}
/* laporan */
.pilih-lap{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.pilih-lap button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer}
.pilih-lap button b{display:block}
.pilih-lap button span{font-size:12px;color:var(--muted)}
.pilih-lap button.on{border:2px solid var(--brand);background:#eef5f4}
.hasil-kartu{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
.kartu-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.kartu-box img{width:100%;display:block;border-radius:6px}
.kartu-box .aksi{margin-top:8px}
.chips-jenis{align-items:center;gap:6px}
.chips-jenis .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.chip-j{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #cfcac0;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.chip-j input{width:auto;margin:0}
.chip-j.on{background:#eef5f4;border-color:var(--brand);color:var(--brand)}
.hasil-kartu.lebar{grid-template-columns:1fr}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:8px}
.thumb{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0;background:#e9e5dc;cursor:pointer;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .vid{font-size:26px;color:#fff;background:#1d2a2b;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.thumb .vid small{font-size:11px;opacity:.8}
.pratinjau{background:#111;border-radius:12px;overflow:hidden}
.pratinjau img{width:100%;max-height:60vh;object-fit:contain;display:block}
.pratinjau iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.prog{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}
.prog .pt{display:flex;gap:8px;justify-content:space-between}
.prog .pt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog .pb{height:6px;background:#eee;border-radius:3px;margin-top:6px;overflow:hidden}
.prog .pb i{display:block;height:100%;background:var(--brand2);transition:width .3s}
.prog.ok .pb i{background:var(--sewa)}.prog.gagal .pb i{background:var(--lewat)}.prog.gagal b{color:var(--lewat)}.prog.ok b{color:var(--sewa)}
details.rinci{margin-top:6px;font-size:14px}
details.rinci summary{cursor:pointer;padding:4px 0}
details.rinci ul{margin:4px 0 0;padding-left:18px;max-height:260px;overflow:auto}
details.rinci li{margin-bottom:6px}
details.rinci .beda{font-size:12px;color:#4b5758;margin-top:2px;word-break:break-word}
.seg{display:inline-flex;border:1px solid #cfcac0;border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.tabel-excel{overflow:auto;max-height:74vh;background:#fff;border:1px solid #c9c4b8;border-radius:8px}
.tabel-excel table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:max-content;min-width:100%}
.tabel-excel th{position:sticky;top:0;z-index:2;background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;text-align:center;padding:8px 8px;border-right:1px solid rgba(255,255,255,.25);white-space:normal;line-height:1.25;vertical-align:middle}
.tabel-excel td{padding:6px 8px;border-right:1px solid #e3ded4;border-bottom:1px solid #e3ded4;vertical-align:top;white-space:nowrap}
.tabel-excel th:first-child,.tabel-excel td:first-child{position:sticky;left:0;z-index:1}
.tabel-excel th:first-child{z-index:3}
.tabel-excel td:first-child{background:inherit}
.tabel-excel tbody tr{cursor:pointer;background:#fff}
.tabel-excel tbody tr:nth-child(even){background:#f8f6f1}
.tabel-excel tbody tr:hover{background:#e9f2f1}
.tabel-excel td.n{text-align:center}
.tabel-excel td.rp{text-align:right}
.tabel-excel td.tgl{text-align:center}
.tabel-excel th:first-child,.tabel-excel td:first-child{width:44px;min-width:44px;max-width:44px}
.tabel-excel td.nama,.tabel-excel th.nama{position:sticky;left:44px;z-index:1;white-space:normal;min-width:230px;max-width:230px;font-weight:600;background:inherit;box-shadow:2px 0 0 #c9c4b8}
.tabel-excel th.nama{z-index:3;background:var(--brand)}
.tabel-excel td.bungkus{white-space:normal;min-width:120px;max-width:170px}
@media(max-width:700px){.tabel-excel td.nama,.tabel-excel th.nama{position:static;min-width:170px;max-width:170px;box-shadow:none}.tabel-excel{max-height:none}}
.tabel-excel td.lebar{white-space:normal;min-width:180px;max-width:260px}
.tabel-excel td.st .badge{font-size:11px}
.tabel-excel td.kode{font-weight:700;text-align:center}
.judul-detail{margin:12px 0 10px}
.judul-detail .jd-1{font-size:20px;font-weight:800;color:#8b1538;line-height:1.25}
.judul-detail .jd-2{font-size:13px;color:var(--muted);margin:2px 0 6px}
.kd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:820px){.kd-grid{grid-template-columns:1fr 1fr}}
.kd{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.kd-j{font-size:12px;font-weight:800;color:#8b1538;letter-spacing:.2px}
.kd-n{font-size:30px;font-weight:800;line-height:1.2;margin:6px 0 2px}
.kd-n small{font-size:14px;font-weight:600;color:var(--muted)}
.kd-s{font-size:12px;color:var(--muted)}
.kd-foto{padding:6px}
.thumb-besar{border:0;padding:0;background:none;cursor:pointer;width:100%;display:block}
.thumb-besar img{width:100%;height:130px;object-fit:cover;border-radius:8px;display:block}
.sub-judul{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.sub-judul h2{margin:0;font-size:15px;color:#8b1538}
.peta-detail{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:8px}
.peta-detail iframe{width:100%;height:260px;border:0;display:block}
.tabel-excel tr.total td{font-weight:800;background:#efefef}
.tabel-excel.rincian th:first-child,.tabel-excel.rincian td:first-child{width:auto;min-width:80px;max-width:none;white-space:nowrap}
.unit-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.unit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tautan-hapus{background:none;border:0;color:var(--lewat);font-weight:700;cursor:pointer;font-size:13px}
.riw{font-size:13px}
.riw .w{color:var(--muted);font-size:12px}
.riw .r{color:#4b5758;word-break:break-word}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">PROPERTY SKN<small>Aset &amp; kontrak sewa</small></div>
    <button class="chip-nama" id="chipNama" onclick="mintaNama(true)">Isi nama</button>
    <button class="btn-ikon" title="Muat ulang data" onclick="muat()">&#x21bb;</button>
  </div>
  <nav id="nav">
    <button data-v="ringkasan">Ringkasan</button>
    <button data-v="aset">Aset</button>
    <button data-v="detail">Detail</button>
    <button data-v="kontrak">Kontrak</button>
    <button data-v="media">Foto</button>
    <button data-v="laporan">Laporan</button>
    <button data-v="riwayat">Riwayat</button>
  </nav>
</header>

<main>
  <section class="view" id="v-ringkasan"></section>

  <section class="view" id="v-aset">
    <div class="alat">
      <input type="search" id="cariAset" placeholder="Cari nama, alamat, penyewa..." oninput="gambarAset()">
      <button class="btn" onclick="formAset()">+ Tambah aset</button>
      <button class="btn ghost" onclick="formImpor()">📥 Perbarui dari Excel</button>
    </div>
    <div class="alat">
      <select id="fALokasi" onchange="gambarAset()"></select>
      <select id="fAJenis" onchange="gambarAset()"></select>
      <select id="fAPemilik" onchange="gambarAset()"></select>
      <select id="fAStatus" onchange="gambarAset()">
        <option value="">Semua status</option>
        <option value="kosong">Belum disewa</option>
        <option value="disewa">Disewa (semua)</option>
        <option value="tempo">Jatuh tempo &le; 90 hari</option>
        <option value="lewat">Lewat tempo</option>
        <option value="pakai">Dipakai sendiri</option>
        <option value="jual">Terjual</option>
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <p class="info" id="infoAset" style="margin:0;flex:1"></p>
      <div class="seg" id="segTampilAset"><button data-t="tabel">▦ Tabel</button><button data-t="kartu">☰ Kartu</button></div>
    </div>
    <div class="list" id="listAset"></div>
  </section>

  <section class="view" id="v-detail"></section>

  <section class="view" id="v-kontrak">
    <div class="alat">
      <input type="search" id="cariKontrak" placeholder="Cari kode, aset, penyewa..." oninput="gambarKontrak()">
      <button class="btn" onclick="formKontrak()">+ Kontrak baru</button>
    </div>
    <div class="alat">
      <select id="fKStatus" onchange="gambarKontrak()">
        <option value="">Semua kontrak</option>
        <option value="aktif">Aktif (semua)</option>
        <option value="tempo">Jatuh tempo &le; 90 hari</option>
        <option value="lewat">Lewat tempo</option>
        <option value="selesai">Tidak aktif</option>
      </select>
      <select id="fKLokasi" onchange="gambarKontrak()"></select>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <p class="info" id="infoKontrak" style="margin:0;flex:1"></p>
      <div class="seg" id="segTampilKontrak"><button data-t="tabel">▦ Tabel</button><button data-t="kartu">☰ Kartu</button></div>
    </div>
    <div class="list" id="listKontrak"></div>
  </section>

  <section class="view" id="v-media">
    <div class="panel" id="kotakLinkUpload" style="padding:12px 14px;margin-bottom:12px;display:none"></div>
    <div class="alat">
      <input type="search" id="cariMedia" placeholder="Cari nama properti, keterangan, file..." oninput="gambarMedia()">
      <button class="btn" onclick="formUpload()">+ Upload foto/video</button>
    </div>
    <div class="alat">
      <select id="fMLokasi" onchange="gambarMedia()"></select>
      <select id="fMJenis" onchange="gambarMedia()"></select>
      <select id="fMTipe" onchange="gambarMedia()"><option value="">Foto &amp; video</option><option>Foto</option><option>Video</option></select>
      <button class="btn ghost" id="btnUnduhMedia" onclick="unduhExcelMedia()">Unduh Excel</button>
    </div>
    <p class="info" id="infoMedia"></p>
    <div class="list" id="listMedia"></div>
  </section>

  <section class="view" id="v-laporan">
    <p class="info">Pilih laporan, atur filter, lalu tekan <b>Buat kartu</b>. Kartu bisa dibagikan langsung ke WA, diunduh, atau ditekan lama di HP untuk simpan/bagikan.</p>
    <div class="pilih-lap" id="pilihLap"></div>
    <div class="alat chips-jenis" id="lJenis"></div>
    <div class="alat">
      <select id="lLokasi"></select>
      <select id="lPemilik"></select>
      <button class="btn" onclick="buatKartu()">Buat kartu</button>
    </div>
    <div id="hasilKartu"></div>
  </section>

  <section class="view" id="v-riwayat">
    <p class="info">200 perubahan terakhir (terbaru di atas).</p>
    <div class="panel"><div id="listRiwayat" class="kosong-teks">Memuat...</div></div>
  </section>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)tutupModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="memuat" id="memuat">Memuat...</div>

<script>
/* ============ VERSI GITHUB PAGES ============
 * URL_EXEC diisi saat membangun github/aplikasi.html. Semua google.script.run lalu lewat fetch ke doPost (anonim,
 * tanpa cookie akun Google) supaya aplikasi bisa dibuka di HP/laptop yang login banyak akun Google.
 * Di Apps Script nilainya kosong -> google.script.run asli yang dipakai. */
var URL_EXEC = 'https://script.google.com/macros/s/AKfycbwuGs1uq43pDFQpdJhdSdDC_Py4OJ5v-gKQsxgx1JLNSK3jEW-Ihgxfi9QOcywA85-W/exec';
function pelariFetch(ok, gagal){
  return new Proxy({}, {get: function(_, fn){
    if (fn === 'withSuccessHandler') return function(f){ return pelariFetch(f, gagal); };
    if (fn === 'withFailureHandler') return function(f){ return pelariFetch(ok, f); };
    return function(){
      var args = Array.prototype.slice.call(arguments);
      fetch(URL_EXEC, {method: 'POST', credentials: 'omit', redirect: 'follow', body: JSON.stringify({src: 'app', fn: fn, args: args})})
        .then(function(r){ if (!r.ok) throw new Error('Server tidak bisa dihubungi (' + r.status + ')'); return r.json(); })

function fmtTgl(s, panjang){ var d = tglObj(s); if (!d) return '-'; return d.getUTCDate() + ' ' + (panjang ? BULAN_PANJANG : BULAN)[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }

/* ============ STATUS ============ */
function statusKontrak(k){
  if (k.STATUS !== 'Aktif') return {kode: 'selesai', label: 'Tidak aktif', urut: 9};
  var h = ada(k.AKHIR) ? selisihHari(S.hariIni, k.AKHIR) : null;
  if (h === null) return {kode: 'sewa', label: 'Disewa', hari: null, urut: 3};
  if (h < 0) return {kode: 'lewat', label: 'Lewat ' + (-h) + ' hari', hari: h, urut: 1};
  if (h <= S.batas) return {kode: 'tempo', label: h === 0 ? 'Habis hari ini' : 'Sisa ' + h + ' hari', hari: h, urut: 2};
  return {kode: 'sewa', label: 'Disewa', hari: h, urut: 3};
}
function kontrakByKode(kode){ kode = String(kode).toUpperCase(); for (var i = 0; i < S.kontrak.length; i++) if (String(S.kontrak[i].KODE).toUpperCase() === kode) return S.kontrak[i]; return null; }
function kontrakAset(a){ return kodeList(a.KODE_SEWA).map(kontrakByKode).filter(Boolean); }
function asetKontrak(k){ var kd = String(k.KODE).toUpperCase(); return S.aset.filter(function(a){ return kodeList(a.KODE_SEWA).some(function(x){ return x.toUpperCase() === kd; }); }); }
function statusAset(a){
  if (a.KONDISI === 'Terjual') return {kode: 'jual', label: 'Terjual', urut: 8};
  if (a.KONDISI === 'Dipakai sendiri') return {kode: 'pakai', label: 'Dipakai sendiri', urut: 7};
  var ks = kontrakAset(a), aktif = ks.filter(function(k){ return k.STATUS === 'Aktif'; });
  if (!aktif.length) return {kode: 'kosong', label: 'Belum disewa', urut: 4, kontrak: ks};
  var terburuk = aktif.map(statusKontrak).sort(function(x, y){ return x.urut - y.urut || (x.hari||0) - (y.hari||0); })[0];
  var sebagian = ks.length > aktif.length;
  return {kode: terburuk.kode, label: terburuk.kode === 'sewa' ? (sebagian ? 'Disewa sebagian' : 'Disewa') : terburuk.label, urut: terburuk.urut, sebagian: sebagian, kontrak: ks};
}
function badge(st){ return '<span class="badge b-' + st.kode + '">' + esc(st.label) + '</span>'; }
function pemilikKontrak(k){
  var as = asetKontrak(k); if (as.length) return as[0].PEMILIK;
  var o = String(k.OWNER).toLowerCase();
  if (o.indexOf('bastian') >= 0) return 'PAK BASTIAN';
  if (o.indexOf('roben') >= 0) return 'PAK ROBEN';
  return k.OWNER || '';
}

/* ============ RINGKASAN ============ */
function hitung(){
  var r = {aset: 0, unit: 0, sewa: 0, kosong: 0, pakai: 0, jual: 0, unitKosong: 0};
  S.aset.forEach(function(a){
    var st = statusAset(a);
    if (st.kode === 'jual') { r.jual++; return; }
    r.aset++; r.unit += Number(a.UNIT) || 0;
    if (st.kode === 'kosong') { r.kosong++; r.unitKosong += Number(a.UNIT) || 0; }
    else if (st.kode === 'pakai') r.pakai++;
    else r.sewa++;
  });
  r.kAktif = 0; r.tempo = 0; r.lewat = 0; r.nilai = 0;
  S.kontrak.forEach(function(k){
    var st = statusKontrak(k);
    if (st.kode === 'selesai') return;
    r.kAktif++; r.nilai += (Number(k.NILAI_SEWA) || 0) * (Number(k.UNIT) || 1);
    if (st.kode === 'tempo') r.tempo++;
    if (st.kode === 'lewat') r.lewat++;
  });
  return r;
}

  var perJenis = {};

    var st = statusAset(a); if (st.kode === 'jual') return;
    var j = perJenis[a.JENIS] || (perJenis[a.JENIS] = {aset: 0, unit: 0, sewa: 0, kosong: 0, pakai: 0});
    j.aset++; j.unit += Number(a.UNIT) || 0;
    if (st.kode === 'kosong') j.kosong++; else if (st.kode === 'pakai') j.pakai++; else j.sewa++;
  });
  var h = '<div class="panel" style="padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>Data diperbarui di Excel?</b><div class="info" style="margin:0">Unggah Excel terbaru, cek perubahannya, lalu terapkan.</div></div><button class="btn" onclick="formImpor()">📥 Perbarui dari Excel</button></div>' +
    '<h2>Kondisi per ' + esc(fmtTgl(S.hariIni, true)) + '</h2><div class="tiles">' +
    tile('', r.aset, 'Aset dimiliki (' + r.unit + ' unit)', "keAset('')") +
    tile('sewa', r.sewa, 'Aset disewa', "keAset('disewa')") +
    tile('kosong', r.kosong, 'Aset belum disewa', "keAset('kosong')") +

    tile('lewat', r.lewat, 'Kontrak lewat tempo (masih Aktif)', "keKontrak('lewat')") +
    tile('', rpSingkat(r.nilai), 'Nilai sewa aktif per tahun', "keKontrak('aktif')") +
    '</div>';
  h += '<h2>Perlu tindakan</h2>';
  if (!tindakan.length) h += '<div class="panel kosong-teks">Tidak ada kontrak yang jatuh tempo dalam ' + S.batas + ' hari.</div>';
  else h += '<div class="list">' + tindakan.map(itemKontrak).join('') + '</div>';
  h += '<h2>Per jenis aset</h2><div class="panel"><table><tr><th>Jenis</th><th class="n">Aset</th><th class="n">Unit</th><th class="n">Disewa</th><th class="n">Belum disewa</th><th class="n">Dipakai sendiri</th></tr>' +
    Object.keys(perJenis).sort().map(function(j){ var x = perJenis[j];
      return '<tr><td>' + esc(j) + '</td><td class="n">' + x.aset + '</td><td class="n">' + x.unit + '</td><td class="n">' + x.sewa + '</td><td class="n">' + x.kosong + '</td><td class="n">' + x.pakai + '</td></tr>'; }).join('') +
    '</table></div>';
  if (r.jual) h += '<p class="info" style="margin-top:8px">' + r.jual + ' aset berstatus Terjual tidak dihitung.</p>';

function cocokCari(q, teks){ q = q.toLowerCase().trim(); if (!q) return true; teks = teks.toLowerCase(); return q.split(/\s+/).every(function(w){ return teks.indexOf(w) >= 0; }); }

  var rows = S.aset.map(function(a){ return {a: a, st: statusAset(a)}; }).filter(function(x){
    var a = x.a, k = x.st.kode;
    if (fl && a.LOKASI !== fl) return false;
    if (fj && a.JENIS !== fj) return false;
    if (fp && a.PEMILIK !== fp) return false;
    if (fs === 'disewa' && ['sewa','tempo','lewat'].indexOf(k) < 0) return false;

    var penyewa = (x.st.kontrak || []).map(function(c){ return c.PENYEWA + ' ' + c.KODE; }).join(' ');
    return cocokCari(q, [a.ID, a.NAMA, a.ALAMAT, a.LOKASI, a.JENIS, a.PEMILIK_DETAIL, a.SERTIFIKAT_NAMA, a.SERTIFIKAT_NO, a.CATATAN, penyewa].join(' '));

    'KODE SEWA', 'STATUS SEWA', 'PENYEWA', 'AKHIR SEWA', 'SISA (BLN)', 'NILAI SEWA TERAKHIR (Rp/thn/unit)', 'CATATAN'];

    var sisa = hari === null ? '' : hari < 0 ? 'Lewat' : blnTeks(hari);
    var nilai = rentangRp(pakai.map(function(k){ return k.NILAI_SEWA; }));
    var w = st.kode === 'kosong' ? '' : warnaSisa(hari);

      ['n', m ? +m[1] : ''], ['', a.PEMILIK], ['', a.LOKASI], ['', a.JENIS], ['bungkus', a.ALAMAT], ['nama', a.NAMA], ['n', a.UNIT], ['bungkus', a.LUAS], ['', a.NILAI_PASAR || '-'], ['bungkus', a.PEMILIK_DETAIL],

  return '<div class="tabel-excel"><table><thead><tr>' + kol.map(function(k){ return '<th' + (k === 'NAMA ASET' ? ' class="nama"' : '') + '>' + esc(k) + '</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody></table></div>' +

  var sewa = aktif.length ? 'Penyewa: ' + esc(aktif.map(function(k){ return k.PENYEWA + ' (s/d ' + fmtTgl(k.AKHIR) + ')'; }).join(', ')) : '';

/* ============ KONTRAK ============ */
function gambarKontrak(){
  var q = $('cariKontrak').value, fs = $('fKStatus').value, fl = $('fKLokasi').value;
  var rows = S.kontrak.filter(function(k){
    var c = statusKontrak(k).kode;
    if (fs === 'aktif' && c === 'selesai') return false;
    if (fs && fs !== 'aktif' && c !== fs) return false;
    if (fl && k.LOKASI !== fl) return false;
    return cocokCari(q, [k.KODE, k.NAMA, k.PENYEWA, k.LOKASI, k.OWNER, k.KET, k.KET_UPDATE].join(' '));
  }).sort(urutKontrak);
  var nilai = rows.reduce(function(s, k){ return s + (k.STATUS === 'Aktif' ? (Number(k.NILAI_SEWA) || 0) * (Number(k.UNIT) || 1) : 0); }, 0);
  $('infoKontrak').textContent = rows.length + ' kontrak' + (nilai ? ' • nilai sewa aktif ' + rp(nilai) + '/tahun' : '');
  var mode = modeTampilKontrak();
  document.querySelectorAll('#segTampilKontrak button').forEach(function(b){ b.classList.toggle('on', b.dataset.t === mode); });
  if (!rows.length) { $('listKontrak').innerHTML = '<div class="panel kosong-teks">Tidak ada kontrak yang cocok.</div>'; return; }
  $('listKontrak').innerHTML = mode === 'tabel' ? tabelKontrak(rows) : rows.map(itemKontrak).join('');
}
function modeTampilKontrak(){ return lsGet('propTampilKontrak') || (window.innerWidth < 700 ? 'kartu' : 'tabel'); }
document.querySelectorAll('#segTampilKontrak button').forEach(function(b){ b.onclick = function(){
  lsSet('propTampilKontrak', b.dataset.t); document.querySelector('main').classList.toggle('lebar', b.dataset.t === 'tabel'); gambarKontrak();
}; });

/** Tabel kontrak dengan kolom & urutan sama seperti sheet KONTRAK SEWA di Excel. */
function tabelKontrak(rows){
  var urut = {}; S.kontrak.forEach(function(k, i){ urut[k.KODE] = i; });
  rows = rows.slice().sort(function(x, y){ return urut[x.KODE] - urut[y.KODE]; });
  var kol = ['KODE', 'NAMA ASET (REKAP SEWA)', 'LOKASI', 'UNIT', 'OWNER', 'PENYEWA', 'STATUS', 'AWAL', 'AKHIR', 'DURASI', 'SISA (BLN)',
    'NILAI SEWA TERAKHIR (Rp/thn/unit)', 'HARGA PASAR', 'HISTORY SEWA (Jt/thn/unit)', 'KET REKAP SEWA', 'KET UPDATE', 'PERINGATAN'];
  var body = rows.map(function(k){
    var st = statusKontrak(k);
    var hari = ada(k.AKHIR) ? selisihHari(S.hariIni, k.AKHIR) : null;
    var aktif = k.STATUS === 'Aktif';
    var sisa = hari === null ? '' : hari < 0 ? 'Lewat' : blnTeks(hari);
    var w = aktif ? warnaSisa(hari) : null;
    var peringatan = !aktif ? '' : st.kode === 'lewat' ? 'Status Aktif tapi akhir sewa sudah lewat' : st.kode === 'tempo' ? 'Jatuh tempo ≤ ' + S.batas + ' hari' : (hari === null ? 'Tanggal akhir belum diisi' : '');
    var sel = [
      ['kode', k.KODE], ['nama', k.NAMA], ['', k.LOKASI], ['n', k.UNIT], ['', k.OWNER], ['lebar', k.PENYEWA],
      ['st', '<span class="badge b-' + (aktif ? (st.kode === 'sewa' ? 'sewa' : st.kode) : 'selesai') + '">' + esc(k.STATUS) + '</span>'],
      ['tgl', ada(k.AWAL) ? tglTabel(k.AWAL) : ''], ['tgl', ada(k.AKHIR) ? tglTabel(k.AKHIR) : ''], ['n', k.DURASI], ['n', sisa],
      ['rp', k.NILAI_SEWA !== '' && k.NILAI_SEWA !== null && k.NILAI_SEWA !== undefined ? rpPenuh(k.NILAI_SEWA) : ''], ['', k.HARGA_PASAR],
      ['lebar', k.HISTORY], ['lebar', k.KET], ['lebar', k.KET_UPDATE], ['lebar', peringatan]
    ];
    return '<tr onclick="detailKontrak(\'' + esc(k.KODE) + '\')">' + sel.map(function(c, i){
      var gaya = (i === 8 || i === 10) && w ? ' style="background:' + w.bg + ';color:' + w.fg + ';font-weight:700"' :
        (i === 16 && peringatan ? ' style="color:' + (st.kode === 'lewat' ? '#9c0006' : '#9c5700') + ';font-weight:700"' : '');
      return '<td class="' + c[0] + '"' + gaya + '>' + (c[0] === 'st' ? c[1] : esc(c[1])) + '</td>';
    }).join('') + '</tr>';
  }).join('');
  return '<div class="tabel-excel"><table><thead><tr>' + kol.map(function(k){ return '<th' + (k.indexOf('NAMA ASET') === 0 ? ' class="nama"' : '') + '>' + esc(k) + '</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    '<p class="info" style="margin-top:6px">Ketuk baris untuk detail / ubah / perpanjang. Warna AKHIR &amp; SISA (kontrak Aktif): <span style="background:#f8cbad;padding:0 4px">≤ 3 bln</span> <span style="background:#ffe699;padding:0 4px">≤ 6 bln</span> <span style="background:#c6efce;padding:0 4px">masih lama</span> <span style="background:#e99a9a;padding:0 4px">lewat</span></p>';
}
function urutKontrak(a, b){
  var x = statusKontrak(a), y = statusKontrak(b);
  return x.urut - y.urut || String(a.AKHIR || '9').localeCompare(String(b.AKHIR || '9')) || String(a.KODE).localeCompare(b.KODE, 'id', {numeric: true});
}
function itemKontrak(k){

function kodeBaru(){

function ownerDariPemilik(p){ p = String(p).toUpperCase(); if (p.indexOf('BASTIAN') >= 0) return 'Bastian H'; if (p.indexOf('ROBEN') >= 0) return 'Roben N'; return ''; }

function lamaTahun(k){

      '</div>' + datalist('dlLokasi', semuaLokasi()) + datalist('dlJenis', semuaJenis()) + datalist('dlOwner', unik(S.kontrak.map(function(x){ return x.OWNER; }))) +

function jalan(fn, args){
  return new Promise(function(ok, gagal){
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ gagal(e && e.message ? e : new Error(String(e))); });
    r[fn].apply(r, args || []);
  });
}
async function jalanUlang(fn, args, kali){
  for (var i = 0; ; i++) {
    try { return await jalan(fn, args); }
    catch (e) { if (i >= (kali || 2) || /kedaluwarsa|gagal \(4/i.test(e.message)) throw e; await new Promise(function(r){ setTimeout(r, 1500 * (i + 1)); }); }
  }
}
function bacaBase64(blob){
  return new Promise(function(ok, gagal){
    var fr = new FileReader();
    fr.onload = function(){ ok(String(fr.result).split(',')[1] || ''); };
    fr.onerror = function(){ gagal(new Error('File tidak bisa dibaca')); };
    fr.readAsDataURL(blob);
  });
}
var MIME_EXT = {jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', heic: 'image/heic', heif: 'image/heif', gif: 'image/gif',
  mp4: 'video/mp4', mov: 'video/quicktime', m4v: 'video/x-m4v', '3gp': 'video/3gpp', mkv: 'video/x-matroska', avi: 'video/x-msvideo', webm: 'video/webm'};
function mimeFile(f){
  if (/^(image|video)\//.test(f.type)) return f.type;
  var ext = String(f.name).split('.').pop().toLowerCase();
  return MIME_EXT[ext] || f.type || '';
}
function rapikanGmaps(s){
  s = String(s || '').trim();
  if (!s) return '';
  var m = s.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  if (m) return 'https://www.google.com/maps?q=' + m[1] + ',' + m[2];
  return /^https?:\/\//i.test(s) ? s : null;
}

async function mulaiUpload(){
  var meta = {ID_ASET: $('m_ASET').value, NAMA_PROPERTI: $('m_NAMA').value.trim(), JENIS: $('m_JENIS').value.trim(), LOKASI: $('m_LOKASI').value.trim(), GMAPS: $('m_GMAPS').value, KETERANGAN: $('m_KET').value.trim()};
  var files = [].slice.call($('m_FILE').files || []);
  if (!meta.NAMA_PROPERTI || !meta.JENIS || !meta.LOKASI) { toast('Nama properti, jenis, dan lokasi wajib diisi', true); return; }
  var g = rapikanGmaps(meta.GMAPS);
  if (g === null) { toast('Link Google Maps harus diawali https:// atau berupa koordinat "lat,lng"', true); return; }
  meta.GMAPS = g;
  if (!files.length) { toast('Pilih foto/video dulu', true); return; }
  var salah = files.filter(function(f){ return !/^(image|video)\//.test(mimeFile(f)); });
  if (salah.length) { toast('Bukan foto/video: ' + salah.map(function(f){ return f.name; }).join(', '), true); return; }
  var besar = files.filter(function(f){ return f.size > 500 * 1024 * 1024; });
  if (besar.length) { toast('Lebih dari 500 MB: ' + besar.map(function(f){ return f.name; }).join(', '), true); return; }
  sedangUpload = true;
  ['btnUpload', 'btnBatalUpload', 'm_FILE'].forEach(function(id){ $(id).disabled = true; });
  var prog = $('progUpload');
  prog.innerHTML = files.map(function(f, i){
    return '<div class="prog" id="pg' + i + '"><div class="pt"><span>' + esc(f.name) + '</span><b>menunggu</b></div><div class="pb"><i style="width:0"></i></div></div>';
  }).join('');
  var ok = 0, gagal = [];
  for (var i = 0; i < files.length; i++) {
    var f = files[i], el = $('pg' + i), lbl = el.querySelector('b'), bar = el.querySelector('i');
    try {
      lbl.textContent = '0%';
      var mulai = await jalanUlang('apiMulaiUpload', [Object.assign({}, meta, {NAMA_FILE: f.name, MIME: mimeFile(f), UKURAN: f.size}), namaSaya()], 1);
      var pos = 0, hasil = null;
      while (pos < f.size) {
        var ujung = Math.min(pos + mulai.potongan, f.size);
        var b64 = await bacaBase64(f.slice(pos, ujung));
        var r = await jalanUlang('apiKirimPotongan', [mulai.uploadId, pos, b64]);
        pos = ujung;
        var pct = Math.round(pos / f.size * 100);
        bar.style.width = pct + '%'; lbl.textContent = pct + '%';
        if (r.selesai) { hasil = r.media; break; }
      }
      if (!hasil) throw new Error('Drive belum mengonfirmasi file selesai');
      S.media = (S.media || []).concat([hasil]);
      lbl.textContent = '✔ selesai'; el.classList.add('ok'); ok++;
    } catch (e) {
      lbl.textContent = '✖ gagal'; el.classList.add('gagal'); gagal.push(f.name + ': ' + e.message);
    }
  }
  sedangUpload = false;
  gambarMedia(); gambarAset();
  $('btnBatalUpload').disabled = false; $('btnBatalUpload').textContent = 'Tutup';
  if (gagal.length) {
    prog.insertAdjacentHTML('beforeend', '<p class="info" style="color:var(--lewat)">' + gagal.map(esc).join('<br>') + '</p>');
    toast(ok + ' berhasil, ' + gagal.length + ' gagal', true);
    $('btnUpload').disabled = false; $('m_FILE').disabled = false;
  } else {
    toast(ok + ' file tersimpan di Google Drive');
  }
}

function muatXlsx(){
  if (window.XLSX) return Promise.resolve();
  return new Promise(function(ok, gagal){
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok; s.onerror = function(){ gagal(new Error('Pustaka Excel gagal dimuat. Cek internet lalu coba lagi.')); };
    document.head.appendChild(s);
  });
}
function unduhExcelMedia(){
  var rows = filterMedia().slice().sort(function(a, b){ return String(a.NAMA_PROPERTI).localeCompare(b.NAMA_PROPERTI) || String(a.WAKTU).localeCompare(String(b.WAKTU)); });
  if (!rows.length) return;

/* ============ PERBARUI DARI EXCEL ============ */
var imporData = null, imporFile = '';
function normHeader(s){ return String(s == null ? '' : s).toUpperCase().replace(/\s+/g, ' ').trim(); }
/** Cari baris judul kolom & petakan kolom -> field. pola = {FIELD: /regex/} */
function petakanSheet(rows, wajib, pola){
  for (var r = 0; r < Math.min(rows.length, 15); r++) {
    var h = rows[r].map(normHeader);
    if (!wajib.every(function(w){ return h.some(function(x){ return w.test(x); }); })) continue;
    var peta = {};
    Object.keys(pola).forEach(function(f){
      for (var c = 0; c < h.length; c++) if (pola[f].test(h[c]) && !Object.keys(peta).some(function(k){ return peta[k] === c; })) { peta[f] = c; break; }
    });
    return {baris: r, peta: peta};
  }
  return null;
}
var POLA_ASET = {NAMA: /^NAMA ASET/, PEMILIK_DETAIL: /^PEMILIK \(DETAIL\)/, PEMILIK: /^PEMILIK/, LOKASI: /^LOKASI$/, JENIS: /^JENIS$/, ALAMAT: /^ALAMAT$/,
  UNIT: /^(JML UNIT|JUMLAH UNIT|UNIT)$/, LUAS: /LUAS/, NILAI_PASAR: /^NILAI PASAR/, KODE_SEWA: /^KODE SEWA/, CATATAN: /^CATATAN/,
  SERTIFIKAT_NAMA: /^(ATAS NAMA|NAMA (DI |PADA )?(SERTIFIKAT|SHM|SHGB|HGB))|(SERTIFIKAT|SHM|SHGB|HGB).*\bNAMA\b/,
  SERTIFIKAT_NO: /^(NO\.?|NOMOR|NOMER) ?(SERTIFIKAT|SHM|SHGB|HGB)|(SERTIFIKAT|SHM|SHGB|HGB).*\b(NO|NOMOR|NOMER)\b|^(SERTIFIKAT|SHM|SHGB|HGB)$/};
/** Judul "SERTIFIKAT" yang digabung di atas 2 sub-kolom (NAMA / NO) di baris bawahnya. */
function petakanSubSertifikat(rows, p){
  var h = rows[p.baris].map(normHeader), sub = (rows[p.baris + 1] || []).map(normHeader);
  for (var c = 0; c < h.length; c++) {
    if (!/^(DATA )?(SERTIFIKAT|SHM)$/.test(h[c])) continue;
    for (var d = c; d < Math.min(c + 3, sub.length); d++) {
      if (d > c && h[d]) break;
      if (/NAMA/.test(sub[d])) p.peta.SERTIFIKAT_NAMA = d;
      else if (/^(NO|NOMOR|NOMER)\b/.test(sub[d])) p.peta.SERTIFIKAT_NO = d;
    }
  }
}
var POLA_KONTRAK = {KODE: /^KODE$/, NAMA: /^NAMA ASET/, LOKASI: /^LOKASI$/, UNIT: /^UNIT$/, OWNER: /^OWNER$/, PENYEWA: /^PENYEWA$/, STATUS: /^STATUS$/,
  AWAL: /^AWAL/, AKHIR: /^AKHIR/, DURASI: /^DURASI/, NILAI_SEWA: /^NILAI SEWA/, HARGA_PASAR: /^HARGA PASAR/, HISTORY: /^HISTORY/, KET_UPDATE: /^KET UPDATE/, KET: /^KET/};
function bacaExcelProperti(buf){
  var wb = XLSX.read(buf, {type: 'array'});
  var ambil = function(nama){ return XLSX.utils.sheet_to_json(wb.Sheets[nama], {header: 1, raw: true, defval: ''}); };
  var cari = function(namaCocok, wajib, pola){
    var urut = wb.SheetNames.slice().sort(function(a, b){ return (namaCocok.test(b) ? 1 : 0) - (namaCocok.test(a) ? 1 : 0); });
    var terbaik = null;
    urut.forEach(function(n){
      if (terbaik && namaCocok.test(terbaik.nama)) return;
      var rows = ambil(n), p = petakanSheet(rows, wajib, pola);
      if (p && (!terbaik || namaCocok.test(n) || rows.length > terbaik.rows.length)) terbaik = {nama: n, rows: rows, p: p};
    });
    return terbaik;
  };
  var sa = cari(/DAFTAR ASET/i, [/^NAMA ASET/, /^PEMILIK/, /^LOKASI$/], POLA_ASET);
  var sk = cari(/KONTRAK/i, [/^KODE$/, /^PENYEWA$/, /^STATUS$/], POLA_KONTRAK);
  var galat = [];
  if (!sa) galat.push('Sheet DAFTAR ASET (kolom NAMA ASET, PEMILIK, LOKASI) tidak ditemukan.');
  if (!sk) galat.push('Sheet KONTRAK SEWA (kolom KODE, PENYEWA, STATUS) tidak ditemukan.');
  if (galat.length) throw new Error(galat.join(' '));
  petakanSubSertifikat(sa.rows, sa.p);
  var keObj = function(s){
    return s.rows.slice(s.p.baris + 1).map(function(row){
      var o = {}; Object.keys(s.p.peta).forEach(function(f){ o[f] = row[s.p.peta[f]]; }); return o;
    });
  };
  var aset = keObj(sa).filter(function(o){ return String(o.NAMA || '').trim() && !/^TOTAL$/i.test(String(o.NAMA).trim()); });
  var kontrak = keObj(sk).filter(function(o){ return String(o.KODE || '').trim() && !/^TOTAL$/i.test(String(o.KODE).trim()); });
  var adaSertifikat = sa.p.peta.SERTIFIKAT_NAMA !== undefined || sa.p.peta.SERTIFIKAT_NO !== undefined;
  return {aset: aset, kontrak: kontrak, adaSertifikat: adaSertifikat, sheetAset: sa.nama, sheetKontrak: sk.nama};
}

/** Teks salinan Excel (tab-separated). Sel yang berisi baris baru dibungkus tanda kutip oleh Excel. */
function bacaTempelanExcel(t){
  var rows = [], row = [], sel = '', kutip = false;
  t = String(t || '').replace(/\r\n?/g, '\n');
  for (var i = 0; i < t.length; i++) {
    var ch = t[i];
    if (kutip) {
      if (ch === '"' && t[i + 1] === '"') { sel += '"'; i++; }
      else if (ch === '"') kutip = false;
      else sel += ch;
    } else if (ch === '"' && sel === '') kutip = true;
    else if (ch === '\t') { row.push(sel); sel = ''; }
    else if (ch === '\n') { row.push(sel); rows.push(row); row = []; sel = ''; }
    else sel += ch;
  }
  if (sel !== '' || row.length) { row.push(sel); rows.push(row); }
  return rows.map(function(r){ return r.map(function(c){ return c.replace(/\s+/g, ' ').trim(); }); });
}

/** Gabungkan baris aset yang berbagi kode kontrak (mis. 1 kontrak untuk beberapa baris aset). */
function grupAset(){
  var induk = {}, perKode = {};
  S.aset.forEach(function(a){ induk[a.ID] = a.ID; });
  function akar(i){ while (induk[i] !== i) { induk[i] = induk[induk[i]]; i = induk[i]; } return i; }
  S.aset.forEach(function(a){
    kodeList(a.KODE_SEWA).forEach(function(kd){
      kd = kd.toUpperCase();
      if (perKode[kd]) { var r1 = akar(a.ID), r2 = akar(perKode[kd]); if (r1 !== r2) induk[r1] = r2; }
      else perKode[kd] = a.ID;
    });
  });
  var g = {}, urut = [];
  S.aset.forEach(function(a, i){ var r = akar(a.ID); if (!g[r]) { g[r] = {idx: i, aset: []}; urut.push(r); } g[r].aset.push(a); });
  return urut.map(function(r){
    var as = g[r].aset, ks = [], sudah = {};
    as.forEach(function(a){ kontrakAset(a).forEach(function(k){ if (!sudah[k.KODE]) { sudah[k.KODE] = 1; ks.push(k); } }); });
    return {idx: g[r].idx, aset: as, kontrak: ks};
  });
}
function gabungUnik(arr, sep){ return unikUrut(arr).join(sep || ', '); }

function teksLuas(a){
  var s = String(a.LUAS || '').trim().replace(/^luas\s*/i, '');
  if (!s || /unit|ruko/i.test(s) || s === String(a.UNIT)) return '';
  return 'Luas ' + s;
}

function teksFilter(f, id){
  return [f.lokasi || 'Semua lokasi', f.pemilik || 'Semua pemilik'].join(' • ');
}

function buatKartu(){
  var f = {lokasi: $('lLokasi').value, pemilik: $('lPemilik').value, jenis: lapDipilih === 'tanah' ? ['TANAH'] : Object.keys(jenisDipilih)};
  $('hasilKartu').innerHTML = '<p class="info">Menyiapkan kartu...</p>';
  var siap = (document.fonts && document.fonts.load) ? Promise.all([
    document.fonts.load('800 40px "Plus Jakarta Sans"'), document.fonts.load('700 28px "Plus Jakarta Sans"'),
    document.fonts.load('500 22px "Plus Jakarta Sans"'), document.fonts.load('600 22px "Plus Jakarta Sans"'),
    document.fonts.load('400 18px "Open Sans"'), document.fonts.load('700 18px "Open Sans"'), document.fonts.load('italic 400 16px "Open Sans"')]).catch(function(){}) : Promise.resolve();
  siap.then(function(){
    var kanvas = lapDipilih === 'ringkasan' ? [kartuRingkasan(f)] : kartuTabel(dataTabel(lapDipilih, f));
    tampilkanKartu(kanvas, lapDipilih);
  });
}

var KW = 1080, KH = 1220, SKALA = 2, FONT = '"Plus Jakarta Sans", system-ui, sans-serif';
function kanvasBaru(){
  var c = document.createElement('canvas'); c.width = KW * SKALA; c.height = KH * SKALA;
  var x = c.getContext('2d'); x.scale(SKALA, SKALA); x.textBaseline = 'alphabetic';
  x.fillStyle = '#f3f1ec'; x.fillRect(0, 0, KW, KH);
  return {c: c, x: x};
}
function font(x, w, s){ x.font = w + ' ' + s + 'px ' + FONT; }
function bungkus(x, teks, maxW, maxBaris){
  var kata = String(teks).split(/\s+/).filter(String), baris = [], cur = '';
  for (var i = 0; i < kata.length; i++) {
    var coba = cur ? cur + ' ' + kata[i] : kata[i];
    if (x.measureText(coba).width <= maxW || !cur) cur = coba;
    else { baris.push(cur); cur = kata[i]; }
  }
  if (cur) baris.push(cur);
  if (baris.length > maxBaris) {
    baris = baris.slice(0, maxBaris);
    var b = baris[maxBaris - 1];
    while (b.length > 1 && x.measureText(b + '…').width > maxW) b = b.slice(0, -1);
    baris[maxBaris - 1] = b + '…';
  }
  // potong kata tunggal yang terlalu panjang
  return baris.map(function(s){ while (s.length > 1 && x.measureText(s).width > maxW) s = s.slice(0, -2) + '…'; return s; });
}
function bulat(x, X, Y, w, h, r){ x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function kepala(x, L, f, id, chips){
  x.fillStyle = '#0f3d3e'; x.fillRect(0, 0, KW, 178);
  x.fillStyle = L.warna; x.fillRect(0, 172, KW, 6);
  x.fillStyle = 'rgba(255,255,255,.72)'; font(x, 700, 19); x.fillText('PT SATELIT KOMUNIKA NUSANTARA • PROPERTY', 56, 50);
  x.fillStyle = '#ffffff'; font(x, 800, 48); x.fillText(L.judul.toUpperCase(), 56, 106);
  x.fillStyle = 'rgba(255,255,255,.85)'; font(x, 500, 22); x.fillText('Per ' + fmtTgl(S.hariIni, true) + '  •  ' + teksFilter(f, id), 56, 146, KW - 112);
  var cx = 56, cy = 196;
  (chips || []).forEach(function(t, i){
    font(x, 700, 22); var w = x.measureText(t).width + 36;
    bulat(x, cx, cy, w, 44, 22); x.fillStyle = i === 0 ? L.warna : '#ffffff'; x.fill();
    if (i) { x.strokeStyle = '#d8d2c6'; x.lineWidth = 2; x.stroke(); }
    x.fillStyle = i === 0 ? '#ffffff' : '#1d2a2b'; x.fillText(t, cx + 18, cy + 29);
    cx += w + 10;
  });
  return 262;
}
function kaki(x, hal, total){
  x.fillStyle = '#d8d2c6'; x.fillRect(56, KH - 62, KW - 112, 2);
  x.fillStyle = '#667476'; font(x, 500, 20);
  x.fillText('Sumber: App Property SKN • dibuat ' + fmtTgl(S.hariIni), 56, KH - 26);
  if (total > 1) { font(x, 700, 20); var t = 'Hal ' + hal + '/' + total; x.fillText(t, KW - 56 - x.measureText(t).width, KH - 26); }
}
function kartuRingkasan(f){
  var L = LAP.filter(function(l){ return l.id === 'ringkasan'; })[0];
  var as = S.aset.filter(function(a){ return (!f.lokasi || a.LOKASI === f.lokasi) && (!f.pemilik || a.PEMILIK === f.pemilik) && statusAset(a).kode !== 'jual'; });
  var ks = S.kontrak.filter(function(k){ return (!f.lokasi || k.LOKASI === f.lokasi) && (!f.pemilik || pemilikKontrak(k) === f.pemilik) && k.STATUS === 'Aktif'; });
  var r = {aset: as.length, unit: 0, sewa: 0, kosong: 0, pakai: 0, tempo: 0, lewat: 0, nilai: 0};
  var perJenis = {}, perLokasi = {};
  as.forEach(function(a){
    var c = statusAset(a).kode, u = Number(a.UNIT) || 0; r.unit += u;
    var j = perJenis[a.JENIS] || (perJenis[a.JENIS] = {aset: 0, sewa: 0, kosong: 0, pakai: 0});
    var l = perLokasi[a.LOKASI] || (perLokasi[a.LOKASI] = {aset: 0, sewa: 0, kosong: 0, pakai: 0});
    j.aset++; l.aset++;
    var key = c === 'kosong' ? 'kosong' : c === 'pakai' ? 'pakai' : 'sewa';
    r[key]++; j[key]++; l[key]++;
  });
  ks.forEach(function(k){ var c = statusKontrak(k).kode; if (c === 'tempo') r.tempo++; if (c === 'lewat') r.lewat++; r.nilai += (Number(k.NILAI_SEWA) || 0) * (Number(k.UNIT) || 1); });
  var k = kanvasBaru(), x = k.x;
  var y = kepala(x, L, f, 'ringkasan', [r.aset + ' aset • ' + r.unit + ' unit', rpSingkat(r.nilai) + ' sewa/tahun']);
  var tiles = [
    {v: r.sewa, t: 'Aset disewa', w: '#1f8a4c'}, {v: r.kosong, t: 'Belum disewa', w: '#2f5d9e'}, {v: r.pakai, t: 'Dipakai sendiri', w: '#6b4fa0'},
    {v: ks.length, t: 'Kontrak aktif', w: '#0f3d3e'}, {v: r.tempo, t: 'Jatuh tempo ≤ ' + S.batas + ' hr', w: '#c77700'}, {v: r.lewat, t: 'Lewat tempo', w: '#c62f2f'}];
  var tw = (KW - 80 - 2 * 16) / 3;
  tiles.forEach(function(t, i){
    var cx = 40 + (i % 3) * (tw + 16), cy = y + Math.floor(i / 3) * 126;
    bulat(x, cx, cy, tw, 112, 16); x.fillStyle = '#fff'; x.fill();
    x.fillStyle = t.w; x.fillRect(cx, cy + 20, 6, 72);
    font(x, 800, 50); x.fillText(String(t.v), cx + 26, cy + 62);
    x.fillStyle = '#5b6869'; font(x, 600, 21); x.fillText(t.t, cx + 26, cy + 94);
  });
  y += 2 * 126 + 14;
  function tabel(judul, obj, yy, maks){
    var kunci = Object.keys(obj).sort(function(a, b){ return obj[b].aset - obj[a].aset || a.localeCompare(b); });
    var lain = kunci.slice(maks);
    kunci = kunci.slice(0, maks);
    if (lain.length) { var g = {aset: 0, sewa: 0, kosong: 0, pakai: 0}; lain.forEach(function(n){ ['aset','sewa','kosong','pakai'].forEach(function(c){ g[c] += obj[n][c]; }); }); obj = Object.assign({}, obj); obj['LAINNYA (' + lain.length + ' lokasi)'] = g; kunci.push('LAINNYA (' + lain.length + ' lokasi)'); }
    var h = 54 + kunci.length * 38 + 12;
    bulat(x, 40, yy, KW - 80, h, 16); x.fillStyle = '#fff'; x.fill();
    var kol = [{t: 'Aset', x: 640}, {t: 'Disewa', x: 770}, {t: 'Kosong', x: 890}, {t: 'Pakai', x: 1000}];
    x.fillStyle = '#0f3d3e'; font(x, 800, 22); x.fillText(judul, 64, yy + 38);
    x.fillStyle = '#667476'; font(x, 600, 18); kol.forEach(function(c){ x.fillText(c.t, c.x - x.measureText(c.t).width, yy + 38); });
    var ry = yy + 54;
    kunci.forEach(function(n, i){
      if (i % 2 === 0) { x.fillStyle = '#f7f5f0'; x.fillRect(48, ry, KW - 96, 38); }
      x.fillStyle = '#1d2a2b'; font(x, 600, 21); x.fillText(bungkus(x, n, 520, 1)[0], 64, ry + 26);
      var v = obj[n]; font(x, 700, 21);
      [[v.aset, '#1d2a2b'], [v.sewa, '#1f8a4c'], [v.kosong, '#2f5d9e'], [v.pakai, '#6b4fa0']].forEach(function(p, j){
        x.fillStyle = p[1]; var s = String(p[0]); x.fillText(s, kol[j].x - x.measureText(s).width, ry + 26);
      });
      ry += 38;
    });
    return yy + h + 14;
  }
  var nJ = Object.keys(perJenis).length;
  var sisaBaris = Math.floor((KH - 80 - y - 2 * 80) / 38);
  var maksJ = Math.min(nJ, Math.max(3, Math.ceil(sisaBaris / 2)));
  y = tabel('Per jenis aset', perJenis, y, maksJ);
  var maksL = Math.max(2, Math.floor((KH - 80 - y - 80) / 38));
  tabel('Per lokasi', perLokasi, y, maksL);
  kaki(x, 1, 1);
  return k.c;
}
function namaFile(id, i, n){ return 'Property-' + id + '-' + S.hariIni + (n > 1 ? '-hal' + (i + 1) : '') + '.png'; }
function tampilkanKartu(kanvas, id){
  var wadah = $('hasilKartu');
  var url = kanvas.map(function(c){ return c.toDataURL('image/png'); });
  wadah.innerHTML = '<div class="aksi" style="margin-top:0">' + (kanvas.length > 1 ? '<button class="btn" id="unduhSemua">Unduh semua (' + kanvas.length + ' kartu)</button>' : '') + '</div>' +
    '<div class="hasil-kartu' + (kanvas[0].width > kanvas[0].height ? ' lebar' : '') + '">' + url.map(function(u, i){
      return '<div class="kartu-box"><img src="' + u + '" alt="Kartu ' + (i + 1) + '"><div class="aksi"><button class="btn kecil" data-bagi="' + i + '">Bagikan</button><button class="btn kecil ghost" data-unduh="' + i + '">Unduh PNG</button></div></div>';
    }).join('') + '</div>' +
    '<p class="info" style="margin-top:8px">Di HP: tekan lama gambar untuk simpan atau bagikan bila tombol Bagikan tidak jalan.</p>';
  function unduh(i){ var a = document.createElement('a'); a.href = url[i]; a.download = namaFile(id, i, kanvas.length); document.body.appendChild(a); a.click(); a.remove(); }
  wadah.querySelectorAll('[data-unduh]').forEach(function(b){ b.onclick = function(){ unduh(+b.dataset.unduh); }; });
  wadah.querySelectorAll('[data-bagi]').forEach(function(b){ b.onclick = function(){
    var i = +b.dataset.bagi;
    kanvas[i].toBlob(function(blob){
      var file = new File([blob], namaFile(id, i, kanvas.length), {type: 'image/png'});
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        navigator.share({files: [file]}).catch(function(e){ if (e && e.name !== 'AbortError') { unduh(i); toast('Bagikan tidak didukung di sini, gambar diunduh'); } });
      } else { unduh(i); toast('Bagikan tidak didukung di browser ini, gambar diunduh'); }
    }, 'image/png');
  }; });
  if ($('unduhSemua')) $('unduhSemua').onclick = function(){ url.forEach(function(u, i){ setTimeout(function(){ unduh(i); }, i * 600); }); };
  wadah.scrollIntoView({behavior: 'smooth', block: 'start'});
}

/* ============ MULAI ============ */
tampilNama();
gambarPilihLap();
bukaTab(lsGet('propTab') || 'ringkasan');
muat();
</script>
